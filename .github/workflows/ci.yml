name: CI

on:
  push:
    paths:
      - "App/**"
      - "NavCore/**"
      - "project.yml"
      - "android/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap Linux job first: pure-Swift logic tests. macOS minutes cost 10x on private repos.
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test NavCore
        run: swift test --package-path NavCore

  # Android: the shared Kotlin core (JVM tests, like NavCore above), then the APK.
  test-android-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test navcore
        run: ./gradlew :navcore:test -Pvesnavi.coreOnly=true

  build-android:
    needs: test-android-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Optional release key (repo secrets). Without it the APK is signed with a throw-away debug key,
      # so updating needs an uninstall first.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk VesNavi.apk
      # Public certificate fingerprint of the release key. With the key in the secrets, an APK signed
      # by anything else fails here, so no release goes out that can't update installed copies.
      - name: Signing certificate
        env:
          HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          RELEASE_CERT_SHA256: e15b8be6da167f347688454e4ff09b5e0e85c31f97a791ae9a7499d32373b08b
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs VesNavi.apk)
          echo "$certs" | grep -E "certificate DN|SHA-256"
          ls -la VesNavi.apk
          if [ "$HAS_RELEASE_KEY" = "true" ] && ! echo "$certs" | grep -q "SHA-256 digest: $RELEASE_CERT_SHA256"; then
            echo "::error::The APK is not signed with the VesNavi release key — check the ANDROID_KEY* secrets."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: VesNavi-apk
          path: android/VesNavi.apk
          retention-days: 14

  build-ios:
    needs: [test-core, build-android]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project VespaNav.xcodeproj -scheme VespaNav \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VespaNav.app Payload/
          zip -qry VespaNav.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VespaNav-ipa
          path: VespaNav.ipa
          retention-days: 14
      # A new MARKETING_VERSION in project.yml publishes the IPA once as Release vX.Y.Z (tag created
      # here), which never expires — artifacts above are kept 14 days only.
      - name: Check for a new version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION: *"\(.*\)".*/\1/p' project.yml)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      # SideStore/AltStore source: add https://github.com/<owner>/<repo>/releases/latest/download/apps.json
      # once in SideStore → Sources; new releases then show up as updates (public repo only).
      - name: SideStore source
        if: steps.version.outputs.new == 'true'
        run: |
          python3 .github/scripts/sidestore-source.py "${TAG#v}" "${{ github.run_number }}" \
            "$GITHUB_REPOSITORY" VespaNav.ipa apps.json
        env:
          TAG: ${{ steps.version.outputs.tag }}
      - name: Android APK
        if: steps.version.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with:
          name: VesNavi-apk
      - name: Publish release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: VesNavi ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            VespaNav.ipa
            VesNavi.apk
            apps.json
          body_path: CHANGELOG.md

