name: Android smoke test

# Installs the APK on an emulator and taps through the main screens (no phone needed).
# Screenshots + logcat are uploaded as the "android-smoke" artifact.
on:
  push:
    paths:
      - "android/**"
      - ".github/scripts/android-smoke.sh"
      - ".github/workflows/android-smoke.yml"
  workflow_dispatch:

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: ./gradlew :app:assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-smoke.sh android/app/build/outputs/apk/release/app-release.apk smoke; status=$?; adb logcat -d > smoke/logcat.txt; exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: smoke/
          retention-days: 14
